apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: terraform-state
  target:
    name: database
  data:
    # `key` is the name of a root module output.
    - secretKey: password
      remoteRef:
        key: db_password
    # `property` is a gjson path into an object output.
    - secretKey: alpha-api-key
      remoteRef:
        key: api_keys
        property: alpha
