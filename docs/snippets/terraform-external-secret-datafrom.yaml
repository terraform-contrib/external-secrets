apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: terraform-state
  target:
    name: platform
  dataFrom:
    # Expand a single object output into one Secret key per field.
    - extract:
        key: api_keys
    # Or select outputs by name. Leave out `find` filters to take them all.
    - find:
        name:
          regexp: "^db_"
