apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: terraform-state
spec:
  provider:
    terraform:
      backend:
        http:
          url: https://gitlab.example.com/api/v4/projects/42/terraform/state/prod
          auth:
            basic:
              usernameSecretRef:
                name: gitlab-tfstate
                key: username
              passwordSecretRef:
                name: gitlab-tfstate
                key: token
          # Optional, for an endpoint with a private CA.
          caProvider:
            type: ConfigMap
            name: internal-ca
            key: ca.crt
