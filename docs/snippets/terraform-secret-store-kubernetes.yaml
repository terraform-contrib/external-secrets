apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: terraform-state
spec:
  provider:
    terraform:
      # Only expose outputs declared with `sensitive = true`.
      sensitiveOnly: true
      backend:
        kubernetes:
          # Reads the Secret named tfstate-default-platform.
          secretSuffix: platform
          workspace: default
          # Only a ClusterSecretStore may name a namespace. Without it the
          # namespace of the referring ExternalSecret is used.
          namespace: terraform
