apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: terraform-state
spec:
  provider:
    terraform:
      backend:
        s3:
          bucket: my-terraform-state
          key: prod/terraform.tfstate
          region: eu-west-1
          # Omit auth entirely to use the AWS SDK default credential chain,
          # which covers IRSA and EKS Pod Identity.
          auth:
            secretRef:
              accessKeyIDSecretRef:
                name: aws-credentials
                key: access-key-id
              secretAccessKeySecretRef:
                name: aws-credentials
                key: secret-access-key
